<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06132e">
  <title>YUYU Naruto Adventure</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <h1>🍥 YUYU CREATOR</h1>
    <h2 class="subtitle">YUYU NARUTO ADVENTURE!</h2>

    <section class="stats" aria-label="Game statistics">
      <span>⭐ Score: <strong id="score">0</strong></span>
      <span>❤️ Lives: <strong id="lives">3</strong></span>
    </section>

    <section class="screen" aria-label="Game area">
      <canvas id="game" width="800" height="450" aria-label="Platform game. Use the arrow keys or A and D to move, and Up, W, or Space to jump.">
        Your browser does not support the HTML canvas element.
      </canvas>
      <div id="menu" class="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle" aria-describedby="menuText">
        <h2 id="menuTitle">YUYU NARUTO ADVENTURE!</h2>
        <p id="menuText">Ready to become a Hokage?</p>
        <button id="play" type="button">▶ PLAY GAME</button>
      </div>
    </section>

    <div class="controls" aria-label="Movement controls">
      <button id="left" type="button" aria-label="Move left">⬅️</button>
      <button id="jump" type="button">⬆️ JUMP</button>
      <button id="right" type="button" aria-label="Move right">➡️</button>
    </div>

    <div class="actions">
      <button id="pause" type="button">⏸ PAUSE</button>
      <button id="restart" type="button">🔄 RESTART</button>
    </div>

    <p class="footer">GAM RAIYAN GAMING © 2026</p>
  </main>
</body>
</html>
